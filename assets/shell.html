/* injected plugin css */
:root{color-scheme:light}body{background-color:#fff;--dsh-boot-bg:#fff}@media(prefers-color-scheme:dark){:root{color-scheme:dark}body{background-color:#151517;--dsh-boot-bg:#151517}}
/*---*/
/* Shared browser controls: DSH, native serve/setup and the project dashboard. */
:root {
  --rdsh-control-accent: var(--dsw-alias-button-primary-fill, var(--acc, var(--blue, #386ed6)));
  --rdsh-control-thumb: var(--dsw-alias-label-tertiary, var(--mut, #8b949e));
  --rdsh-control-track: var(--dsw-alias-border-l3, var(--line, #30363d));
  --rdsh-control-surface: var(--dsw-alias-bg-module-platform, var(--card, #161b22));
}
* {
  scrollbar-width: thin;
  scrollbar-color: var(--rdsh-control-thumb) transparent;
}
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track, *::-webkit-scrollbar-corner { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: var(--rdsh-control-thumb);
  background-clip: content-box;
  border: 3px solid transparent;
  border-radius: 10px;
}
*::-webkit-scrollbar-thumb:hover { background-color: var(--rdsh-control-accent); }
input[type="range"] {
  appearance: none;
  -webkit-appearance: none;
  min-width: 0;
  height: 32px;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  accent-color: var(--rdsh-control-accent);
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 4px; border-radius: 4px; background: var(--rdsh-control-track);
}
input[type="range"]::-moz-range-track {
  height: 4px; border-radius: 4px; background: var(--rdsh-control-track);
}
input[type="range"]::-moz-range-progress {
  height: 4px; border-radius: 4px; background: var(--rdsh-control-accent);
}
input[type="range"]::-webkit-slider-thumb {
  appearance: none; -webkit-appearance: none;
  width: 18px; height: 18px; margin-top: -7px;
  border: 2px solid var(--rdsh-control-surface); border-radius: 50%;
  background: var(--rdsh-control-accent);
}
input[type="range"]::-moz-range-thumb {
  box-sizing: border-box; width: 18px; height: 18px;
  border: 2px solid var(--rdsh-control-surface); border-radius: 50%;
  background: var(--rdsh-control-accent);
}
input[type="range"]:focus-visible {
  outline: 2px solid var(--rdsh-control-accent); outline-offset: 3px;
}
input[type="range"]:disabled { opacity: .45; cursor: not-allowed; }
@media (forced-colors: active) {
  * { scrollbar-color: auto; }
  input[type="range"] { appearance: auto; -webkit-appearance: auto; }
}

/*---*/

.btwlive_root {
  box-sizing: border-box;
  min-width: 0;
  margin: 8px 0 12px;
  padding: 8px 12px 10px;
  border-left: 2px solid var(--dsw-alias-brand-primary, #4d6bfe);
  border-radius: 0 var(--dsw-radius-lg, 8px) var(--dsw-radius-lg, 8px) 0;
  background: var(--dsw-alias-bg-layer-1, transparent);
  background: color-mix(in srgb, var(--dsw-alias-brand-primary, #4d6bfe) 5%, transparent);
  color: var(--dsw-alias-label-primary, inherit);
}
.btwlive_head {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-width: 0;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.btwlive_head:focus-visible {
  outline: 1.5px solid var(--dsw-focus-ring-color, var(--dsw-alias-brand-primary, #4d6bfe));
  outline-offset: 3px;
  border-radius: var(--dsw-radius-sm, 4px);

.btwlive_badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex: none;
  color: var(--dsw-alias-brand-primary, #4d6bfe);
  font-size: 11px;
  font-weight: 600;
  line-height: 18px;
  letter-spacing: 0.06em;
}
.btwlive_glyph {
  flex: none;
  width: 12px;
  height: 12px;
}
.btwlive_question {
  display: -webkit-box;
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;

  line-height: calc(18px + var(--dsh-content-font-delta-secondary, 0px));
  overflow-wrap: anywhere;
}
.btwlive_chevron {
  flex: none;
  width: 12px;
  height: 12px;
  color: var(--dsw-alias-label-tertiary, #999);
  transition: transform 0.12s ease;
}
.btwlive_root[data-open="false"] .btwlive_chevron {
  transform: rotate(-90deg);

  min-width: 0;
  margin-top: 8px;
  padding-top: 8px;

  min-width: 0;
  max-height: min(440px, 60vh);
  overflow: auto;

  display: inline-flex;
  gap: 3px;
}
.btwlive_dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: currentColor;
  animation: btwlive-pulse 1.1s ease-in-out infinite;
}
.btwlive_dot:nth-child(2) {
  animation-delay: 0.15s;
}
.btwlive_dot:nth-child(3) {
  animation-delay: 0.3s;
}
@keyframes btwlive-pulse {
  0%, 80%, 100% {
    opacity: 0.25;
    transform: translateY(0);
  }
  40% {
    opacity: 1;
    transform: translateY(-1.5px);

  }

.dsh-iui {
	/* Series colours stay chromatic in both themes; the brand token is near-black in
	   light mode and near-white in dark, which reads as a wireframe in a chart. */
	--dsh-iui-series-1: var(--dsw-alias-state-business-primary, #4176e6);
	--dsh-iui-series-2: var(--dsw-alias-state-success-primary, #14a76c);
	--dsh-iui-series-3: var(--dsw-alias-state-warn-primary, #e08a00);
	--dsh-iui-series-4: var(--dsw-alias-state-error-primary, #e5484d);
	--dsh-iui-series-5: var(--dsw-alias-state-idle-primary, #8a8f98);
	display: flex;
	flex-direction: column;
	gap: 8px;
	font-family: var(--dsw-font-family, inherit);
	font-size: var(--dsw-font-xs-13, 13px);
	line-height: 1.6;
	color: var(--dsw-alias-label-primary, inherit);
}
.dsh-iui *, .dsh-iui *::before, .dsh-iui *::after { box-sizing: border-box; }
.dsh-iui-card {
	border: .5px solid var(--dsw-alias-border-l1, rgba(128,128,128,.25));
	border-radius: var(--dsw-radius-lg, 12px);
	background: var(--dsw-alias-bg-layer-1, rgba(128,128,128,.06));
	overflow: hidden;
}
.dsh-iui-tail { display: flex; flex-direction: column; gap: 12px; margin-top: 2px; }
.dsh-iui-settled { flex-direction: row; align-items: center; gap: 8px; color: var(--dsw-alias-label-secondary, inherit); }
.dsh-iui-settled-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dsh-iui-head {
	display: flex; align-items: center; gap: 8px;
	padding: 9px 14px;
	border-bottom: .5px solid var(--dsw-alias-border-l1, rgba(128,128,128,.25));
}
.dsh-iui-badge { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--dsw-alias-brand-primary, #4d6bfe); }
.dsh-iui-badge-error { background: var(--dsw-alias-state-error-primary, #e5484d); }
.dsh-iui-head-text { flex: 1 1 auto; min-width: 0; }
.dsh-iui-head-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dsh-iui-head-summary { color: var(--dsw-alias-label-secondary, inherit); font-size: var(--dsw-font-xxs-12, 12px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dsh-iui-head-note { flex: none; color: var(--dsw-alias-label-tertiary, var(--dsw-alias-label-secondary, inherit)); font-size: var(--dsw-font-xxs-12, 12px); }
.dsh-iui-body { display: flex; flex-direction: column; gap: 14px; padding: 14px; }
.dsh-iui-foot { padding: 0 14px 10px; color: var(--dsw-alias-label-tertiary, var(--dsw-alias-label-secondary, inherit)); font-size: var(--dsw-font-xxs-12, 12px); }
.dsh-iui-block-title { font-weight: 600; margin-bottom: 6px; }
.dsh-iui-block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.dsh-iui-axis-caption { flex: none; color: var(--dsw-alias-label-tertiary, var(--dsw-alias-label-secondary, inherit)); font-size: 11px; }

.dsh-iui-section { display: flex; flex-direction: column; gap: 6px; }
.dsh-iui-section-title { margin: 0; font-size: 1em; font-weight: 600; }
.dsh-iui-section-subtitle { margin: 0; color: var(--dsw-alias-label-secondary, inherit); font-size: var(--dsw-font-xxs-12, 12px); }
.dsh-iui-section-body { display: flex; flex-direction: column; gap: 12px; }

.dsh-iui-row { display: flex; flex-wrap: wrap; gap: 12px; }

.dsh-iui-axis-tick, .dsh-iui-edge-label { fill: var(--dsw-alias-label-tertiary, var(--dsw-alias-label-secondary, inherit)); font-size: 9px; }
.dsh-iui-bar { transition: opacity .12s ease; }
.dsh-iui-slice { stroke: var(--dsw-alias-bg-layer-1, transparent); stroke-width: 1; }
.dsh-iui-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0; padding: 0; list-style: none; }
.dsh-iui-legend-item { display: inline-flex; align-items: center; gap: 6px; color: var(--dsw-alias-label-secondary, inherit); font-size: var(--dsw-font-xxs-12, 12px); }
.dsh-iui-swatch { width: 8px; height: 8px; border-radius: 2px; flex: none; }

.dsh-iui-comparison { display: flex; flex-direction: column; min-width: 0; }
.dsh-iui-comparison-grid { display: grid; gap: 0; border: .5px solid var(--dsw-alias-border-l1, rgba(128,128,128,.25)); border-radius: var(--dsw-radius-md, 8px); overflow: hidden; }
.dsh-iui-comparison-grid > div { padding: 7px 10px; border-bottom: .5px solid var(--dsw-alias-border-l1, rgba(128,128,128,.25)); min-width: 0; }

.dsh-iui-comparison-hint { color: var(--dsw-alias-label-tertiary, var(--dsw-alias-label-secondary, inherit)); font-size: var(--dsw-font-xxs-12, 12px); font-weight: 400; }
