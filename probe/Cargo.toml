[package]
name = "probe"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
anyrender = "0.14"
anyrender_vello_cpu = { version = "0.18", features = ["softbuffer_window_renderer"] }
anyrender_vello = "0.15"
blitz = "0.3.0-beta.4"
blitz-dom = "0.3.0-beta.4"
blitz-html = "0.3.0-beta.4"
blitz-shell = "0.3.0-beta.4"
blitz-net = "0.3.0-beta.4"
blitz-paint = "0.3.0-beta.4"
blitz-traits = "0.3.0-beta.4"
parley = "0.12"
peniko = "0.6"
png = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
winit = "=0.31.0-beta.3"
tokio-tungstenite = "0.28"
futures-util = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
anyhow = "1"
# Plain HTTP to the local DSH host only: no TLS stack in the binary.
reqwest = { version = "0.13", default-features = false, features = ["cookies"] }
